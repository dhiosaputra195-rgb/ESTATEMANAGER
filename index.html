<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESTATE MANAGER · Golden Park</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#eef3ef;--card:#fff;--tx:#12271c;--mut:#62776b;--btn:#14532d;--gold:#c9a227;--soft:#e4efe7;--line:#dce6de;--todo:#b45309;--prog:#2563eb;--done:#15803d;--side:#0c3820;--sh:0 1px 2px rgba(18,39,28,.06),0 10px 28px rgba(18,39,28,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1812;--card:#16251d;--tx:#e8f0ea;--mut:#93a89b;--btn:#1f7a47;--soft:#1d3a2b;--line:#26382e;--todo:#f59e0b;--prog:#60a5fa;--done:#4ade80;--side:#09241a;--sh:0 1px 2px #0006}}
:root[data-theme="dark"]{--bg:#0d1812;--card:#16251d;--tx:#e8f0ea;--mut:#93a89b;--btn:#1f7a47;--soft:#1d3a2b;--line:#26382e;--todo:#f59e0b;--prog:#60a5fa;--done:#4ade80;--side:#09241a;--sh:0 1px 2px #0006}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:500 14px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--side);color:#fff;border-bottom:3px solid var(--gold)}
.brand{display:flex;gap:10px;align-items:center;min-width:0}.brand h1{font-size:15px;font-weight:800;letter-spacing:.06em;line-height:1.2}.brand p{font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#e6c75a,#b8881f);color:#1a2e22;font-weight:800}
.user{display:flex;gap:8px;align-items:center;background:#ffffff1a;border:0;color:#fff;border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer;font:inherit;text-align:left}.user b{font-size:12px;display:block;line-height:1.2}.user small{font-size:10px;opacity:.8}
.av{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1a2e22;font-weight:800;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mut);font:700 10px inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--btn);background:var(--soft)}nav .f{display:none}
main{padding:16px 16px 120px;max-width:1040px}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:18px;border:0;background:linear-gradient(135deg,#1f7a47,#14532d);color:#fff;font-size:26px;box-shadow:0 10px 24px rgba(20,83,45,.4);cursor:pointer;z-index:6}
.fab:active,.btn:active{transform:scale(.96)}
@media(min-width:900px){
body:before{content:"";position:fixed;left:0;top:0;bottom:0;width:270px;background:var(--side);z-index:4}
header{position:fixed;left:0;top:0;width:270px;flex-direction:column;align-items:stretch;border:0;padding:26px 20px 12px;background:none;gap:18px}
.brand{flex-direction:column;align-items:flex-start;gap:14px}.brand .lg{height:auto;width:200px}.brand .dv{display:none}.brand h1{font-size:17px}.brand p{white-space:normal}.user{border-radius:14px;padding:8px}
nav{top:300px;bottom:0;width:270px;right:auto;flex-direction:column;justify-content:flex-start;border:0;box-shadow:none;background:none;padding:6px 14px;gap:4px}
nav button{flex:none;flex-direction:row;font-size:14px;gap:12px;padding:11px 12px;color:#cfe3d6;justify-content:flex-start}
nav button.on{background:#ffffff1f;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}nav .s{display:none}nav .f{display:inline}
main{margin-left:270px;padding:30px 40px 60px}.fab{bottom:32px;right:40px}}
.hero{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,#0f4a2a,#14532d 60%,#1b6a3b);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border:26px solid #c9a22733;border-radius:50%}
.ring{flex:none;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),#ffffff26 0);display:grid;place-items:center;position:relative;z-index:1}
.ring>div{width:72px;height:72px;border-radius:50%;background:#0f4a2a;display:grid;place-content:center;text-align:center;line-height:1.1}.ring b{font-size:20px}.ring small{font-size:10px;opacity:.8}
.hs{flex:1;min-width:0;position:relative;z-index:1}.hs .t{font-weight:700;opacity:.85;font-size:12px;margin-bottom:8px}
.hr{display:flex;gap:8px}.hr>div{flex:1;background:#ffffff1a;border-radius:12px;padding:8px 10px}.hr b{font-size:20px;display:block;line-height:1.1}.hr small{font-size:10px;opacity:.85}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:20px 0 4px}.mut{color:var(--mut);font-size:12px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-top:12px;box-shadow:var(--sh);border:1px solid var(--line)}
.card[class*="s-"]{border-left:4px solid var(--c)}
.s-todo{--c:var(--todo)}.s-progress{--c:var(--prog)}.s-done{--c:var(--done)}
.item{display:flex;gap:12px;align-items:center;padding:12px 0 12px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .15s;border-radius:8px}
.item:hover{background:var(--soft)}.item:last-child{border-bottom:0}.item>div:nth-child(2){flex:1;min-width:0}
.item[class*="s-"]:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--c)}
.dt{min-width:48px;text-align:center;background:var(--soft);border-radius:12px;padding:6px 0;font-weight:800;line-height:1.1;font-size:16px}.dt small{display:block;font-weight:600;color:var(--mut);font-size:10px}
.tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,currentColor 14%,transparent)}
.todo{color:var(--todo)}.progress{color:var(--prog)}.done{color:var(--done)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:8px 0 0;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 15px;font:700 13px inherit;cursor:pointer;white-space:nowrap;transition:.15s}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.btn{border:0;border-radius:12px;padding:10px 16px;font:700 13px inherit;cursor:pointer;background:var(--btn);color:#fff;transition:transform .1s}.btn.g{background:var(--soft);color:var(--tx)}.btn.r{background:#dc262622;color:#dc2626}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:11px 12px;font:500 14px inherit;margin-top:5px}
input:focus,select:focus,textarea:focus{border-color:var(--btn);outline:0}label{display:block;margin-top:12px;font-weight:700;font-size:13px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tw{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-size:12px;font-weight:800;white-space:nowrap}tbody tr:nth-child(even){background:color-mix(in srgb,var(--soft) 35%,transparent)}tr:last-child td{border:0}
tfoot td{font-weight:800;background:var(--soft)}td.n,th.n{text-align:center}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer;border:1px solid var(--line)}
.up{display:inline-block}.up input{display:none}
#mw{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9;padding-top:env(safe-area-inset-top,0px);backdrop-filter:blur(3px)}#mw.show{display:flex}
#mb{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .22s ease-out}
#mb img{width:100%;border-radius:14px}@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(min-width:700px){#mw{align-items:center;padding:20px}#mb{border-radius:24px}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;display:none;z-index:10;box-shadow:var(--sh)}
.empty{text-align:center;color:var(--mut);padding:30px 8px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 0}.sec h3{font-size:15px;font-weight:800}.w6{min-width:760px}.gh td{background:var(--soft);font-weight:800}
.auth{max-width:440px;margin:6vh auto 0}.lg{height:34px;width:auto;flex:none}.dv{width:1px;align-self:stretch;background:#ffffff40}.plate{background:#fff;border-radius:18px;padding:16px;text-align:center;box-shadow:var(--sh)}.plate img{width:min(250px,75%)}
.in{animation:in .28s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

function backup(){const d={app:'estate-golden-park',v:3,at:new Date().toISOString(),A:A.map(a=>({tgl:a.tgl,akt:a.akt,ket:a.ket,st:a.st,div:a.div,byr:a.byr,ven:a.ven,pic:a.pic,rutin:a.rutin,sampai:a.sampai})),U:U.map(u=>({username:u.u,name:u.n,role:u.role}))};const b=new Blob([JSON.stringify(d,null,1)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`backup-estate-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);toast('Backup diunduh')}
function restore(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result),arr=Array.isArray(d)?d:(d.A||[]);if(!Array.isArray(arr)||!arr.length)throw new Error('file kosong');if(!confirm('Impor '+arr.length+' kegiatan dari file ini ke database?'))return;const rows=arr.map(a=>({tgl:a.tgl,akt:a.akt,ket:a.ket||'',st:a.st||'todo',div:a.div||'',byr:+a.byr||0,ven:a.ven||'',pic:a.pic||'',rutin:false,sampai:null,oleh:me()?.n||''}));const{error}=await sb.from('activities').insert(rows);if(error)throw error;await loadData();draw();toast(arr.length+' kegiatan diimpor')}catch(e){toast('Gagal impor: '+e.message)}};r.onerror=()=>toast('Gagal membaca file');r.readAsText(f)}

/* ---------- CRUD kegiatan ---------- */
const grp=l=>[...DIV,''].map(d=>[d,l.filter(a=>d===''?!DIV.includes(a.div):a.div===d)]).filter(g=>g[1].length);
const detL=()=>sorted(inYr().filter(a=>mq(a)&&(S.fm==='all'||D(a.tgl).getMonth()==S.fm)&&(S.fs==='all'||a.st===S.fs)&&(S.fd==='all'||a.div===S.fd)));
const sumM=()=>BLN.map((b,i)=>{const l=inYr().filter(a=>D(a.tgl).getMonth()===i&&(S.sd==='all'||a.div===S.sd)&&mq(a)),c=k=>l.filter(a=>a.st===k).length,by=l.reduce((s,a)=>s+(+a.byr||0),0);return [b+' '+S.yr,c('done'),c('progress'),c('todo'),rp(by)]});
function pdf(k){const J=window.jspdf;if(!J||!J.jsPDF)return toast('Pustaka PDF belum termuat. Periksa koneksi internet lalu coba lagi.');
 const doc=new J.jsPDF({unit:'mm',format:'a4'}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),det=k==='det';
 try{doc.addImage(LG_O,'PNG',14,10,36,18.3)}catch(e){}
 doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(18,39,28);doc.text(det?'Laporan Detail Kegiatan':'Laporan Summary Kegiatan',W-14,16,{align:'right'});
 doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90);
 doc.text('Estate Management Golden Park',W-14,22,{align:'right'});
 doc.text(`Tahun ${S.yr} | `+(det?`${S.fm==='all'?'Semua bulan':BLN[S.fm]} | ${S.fd==='all'?'Semua divisi':S.fd} | ${S.fs==='all'?'Semua status':ST[S.fs][0]}`:(S.sd==='all'?'Semua divisi':S.sd)),W-14,27,{align:'right'});
 doc.setDrawColor(193,162,39);doc.setLineWidth(.8);doc.line(14,32,W-14,32);
 const o={startY:37,theme:'grid',styles:{fontSize:8,cellPadding:2,lineColor:[220,230,222],textColor:[18,39,28]},headStyles:{fillColor:[20,83,45],textColor:255,halign:'center'},alternateRowStyles:{fillColor:[243,247,244]},margin:{left:14,right:14,bottom:16}};
 if(det){let n=0;const body=[];grp(detL()).forEach(([d,x])=>{body.push([{content:`${d||'Belum ditentukan'} (${x.length} kegiatan)`,colSpan:9,styles:{fillColor:[228,239,230],fontStyle:'bold',halign:'left'}}]);x.forEach(a=>body.push([++n,fl(a.tgl),a.div||'-',a.akt,ST[a.st][0],a.ven||'-',a.pic||'-',a.byr?rp(a.byr):'-',a.ket||'-']))});
 doc.autoTable({...o,head:[['No','Hari/Tanggal','Divisi','Aktivitas','Status','Vendor','PIC','Biaya','Keterangan']],body,columnStyles:{0:{halign:'center',cellWidth:8},1:{cellWidth:24},2:{cellWidth:18},4:{cellWidth:16,halign:'center'},5:{cellWidth:19},6:{cellWidth:17},7:{cellWidth:19,halign:'right'}}})}
 else{const m=sumM(),t=i=>m.reduce((x,r)=>x+r[i],0);doc.autoTable({...o,head:[['Bulan, tahun','Total aktivitas selesai','Total aktivitas sedang dikerjakan','Total aktivitas belum dikerjakan','Total biaya']],body:m,foot:[['Total '+S.yr,t(1),t(2),t(3),rp(t(4))]],footStyles:{fillColor:[228,239,230],textColor:[18,39,28],fontStyle:'bold'},columnStyles:{1:{halign:'center'},2:{halign:'center'},3:{halign:'center'},4:{halign:'right'}}})}
 const n=doc.internal.getNumberOfPages();
 for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text(`Dicetak ${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})} oleh ${me().n}`,14,H-8);doc.text(`Halaman ${i} dari ${n}`,W-14,H-8,{align:'right'})}
 doc.save(`Laporan-${det?'Detail':'Summary'}-${S.yr}-GoldenPark.pdf`);toast('PDF diunduh')}

async function genRutin(a){if(!a||!a.rutin||!a.sampai)return 0;const b=D(a.tgl),end=new Date(a.sampai.slice(0,7)+'-01T00:00:00');const rows=[];
 for(let d=new Date(b.getFullYear(),b.getMonth()+1,1);d<=end;d=new Date(d.getFullYear(),d.getMonth()+1,1)){const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),tgl=fiso(d.getFullYear(),d.getMonth(),Math.min(b.getDate(),last));if(A.some(x=>(x.induk||x.id)===a.id&&String(x.tgl).slice(0,7)===tgl.slice(0,7)))continue;rows.push({tgl,akt:a.akt,ket:a.ket,st:'todo',div:a.div,byr:a.byr,ven:a.ven,pic:a.pic,rutin:true,induk:a.id,oleh:me()?.n||''})}
 if(rows.length){const{error}=await sb.from('activities').insert(rows);if(error)throw error}return rows.length}
async function nextMonth(id){const a=A.find(x=>x.id===id);if(!a)return;const b=D(a.tgl),mm=b.getMonth()+1,yy=b.getFullYear()+Math.floor(mm/12),m2=mm%12,last=new Date(yy,m2+1,0).getDate(),tgl=fiso(yy,m2,Math.min(b.getDate(),last));if(A.some(x=>(x.induk||x.id)===(a.induk||a.id)&&String(x.tgl).slice(0,7)===tgl.slice(0,7)))return toast('Sudah ada untuk bulan itu');
 try{const{error}=await sb.from('activities').insert({tgl,akt:a.akt,ket:a.ket,st:'todo',div:a.div,byr:a.byr,ven:a.ven,pic:a.pic,rutin:true,induk:a.induk||a.id,oleh:me()?.n||''});if(error)throw error;await loadData();draw();toast('Kegiatan bulan berikutnya dibuat')}catch(e){toast('Gagal: '+e.message)}}
function openAct(id){const isNew=!id;const a=id?A.find(x=>x.id===id):{tgl:pd(S.mo,Math.min(NOW.getDate(),28)),akt:'',ket:'',st:'todo',div:S.dv==='all'?'':S.dv,byr:'',ven:'',pic:'',doc:[],rutin:false,sampai:'',foto:[]};
 const defEnd=ym(new Date(NOW.getFullYear(),NOW.getMonth()+5,1));
 om(`<h2>${id?'Ubah kegiatan':'Kegiatan baru'}</h2><label>Tanggal</label><input id="ft" type="date" value="${a.tgl}"><label>Aktivitas</label><input id="fa" value="${E(a.akt)}"><label>Divisi</label><select id="fdv"><option value="">(pilih divisi)</option>${DIV.map(d=>`<option ${a.div===d?'selected':''}>${d}</option>`).join('')}</select><label>Keterangan</label><textarea id="fk" rows="3">${E(a.ket)}</textarea>
<div class="row"><div style="flex:1;min-width:150px"><label>Vendor / Kontraktor</label><input id="fvn" value="${E(a.ven||'')}" placeholder="cth: PT Maju Jaya"></div><div style="flex:1;min-width:150px"><label>PIC / Penanggung jawab</label><input id="fpc" value="${E(a.pic||'')}" placeholder="cth: Budi"></div></div>
<label>Biaya (Rp)</label><input id="fby" type="number" min="0" step="1000" value="${a.byr||''}" placeholder="0">
<label>Status</label><select id="fs2">${Object.keys(ST).map(k=>`<option value="${k}" ${a.st===k?'selected':''}>${ST[k][0]} (${ST[k][1]})</option>`).join('')}</select>
<label style="display:flex;gap:10px;align-items:center;margin-top:14px"><input type="checkbox" id="fru" style="width:auto;margin:0" ${a.rutin?'checked':''} onchange="document.getElementById('rutBox').style.display=this.checked?'block':'none'"> Jadwal rutin bulanan</label>
<div id="rutBox" style="display:${a.rutin?'block':'none'}"><label>Ulangi sampai bulan</label><input id="frs" type="month" value="${a.sampai||defEnd}"><p class="mut" style="margin-top:4px">Salinan bulanan otomatis dibuat sampai bulan ini (status awal: To do).</p></div>
<label>Lampiran dokumen</label>${isNew?'<p class="mut">Simpan kegiatan dulu, lalu tambahkan lampiran lewat menu Dokumentasi.</p>':`<label class="btn g up" style="margin:0">📎 Tambah file<input type="file" multiple onchange="addDoc('${a.id}',this.files)"></label><div class="row" style="margin-top:8px;gap:6px">${(a.doc||[]).map((f,i)=>`<span class="row" style="gap:2px"><button class="chip" onclick="viewDoc('${a.id}',${i})">📎 ${E(f.name)}</button><button class="chip" onclick="delDoc('${a.id}',${i})">✕</button></span>`).join('')}</div>`}
<div class="row" style="margin-top:16px"><button class="btn" onclick="saveAct(${id?`'${id}'`:'null'})">Simpan</button>${id&&isA()?`<button class="btn r" onclick="delAct('${id}')">Hapus</button>`:''}<button class="btn g" onclick="cm()">Batal</button></div>`)}
async function saveAct(id){const o={tgl:$('ft').value,akt:$('fa').value.trim(),ket:$('fk').value.trim(),st:$('fs2').value,div:$('fdv').value,byr:+($('fby').value||0),ven:$('fvn').value.trim(),pic:$('fpc').value.trim(),rutin:$('fru').checked,sampai:($('fru').checked&&$('frs').value)?$('frs').value+'-01':null};if(!o.tgl||!o.akt)return toast('Tanggal dan aktivitas wajib diisi');if(!o.div)return toast('Pilih divisi');
 try{let item;if(id){const{error}=await sb.from('activities').update({...o,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;item={id,...o}}else{const{data,error}=await sb.from('activities').insert({...o,oleh:me().n}).select().single();if(error)throw error;item={id:data.id,...o}}
  S.yr=+o.tgl.slice(0,4);S.dv='all';S.mo=D(o.tgl).getMonth();let n=0;if(o.rutin)n=await genRutin(item);await loadData();cm();draw();toast(n?'Tersimpan · '+n+' jadwal rutin dibuat':'Tersimpan')}catch(e){toast('Gagal simpan: '+e.message)}}
const delAct=id=>om(`<h2>Hapus kegiatan?</h2><p class="mut" style="margin-top:6px">Kegiatan beserta foto dan lampirannya akan dihapus permanen.</p><div class="row" style="margin-top:14px"><button class="btn r" onclick="doDelAct('${id}')">Hapus</button><button class="btn g" onclick="cm()">Batal</button></div>`);
async function doDelAct(id){const a=A.find(x=>x.id===id);try{for(const p of (a?.foto||[])){const q=pathOf(p.url);if(q)await sb.storage.from('estate').remove([q])}for(const f of (a?.doc||[])){const q=pathOf(f.url);if(q)await sb.storage.from('estate').remove([q])}const{error}=await sb.from('activities').delete().eq('id',id);if(error)throw error;await loadData();cm();draw();toast('Kegiatan dihapus')}catch(e){toast('Gagal: '+e.message)}}

/* ---------- hero & render ---------- */
const hero=()=>{const l=inYr(),c=k=>l.filter(a=>a.st===k).length,t=l.length,p=t?Math.round(c('done')/t*100):0,by=l.reduce((s,a)=>s+(+a.byr||0),0);return `<section class="hero"><div class="ring" style="--p:${p}"><div><b>${p}%</b><small>selesai</small></div></div><div class="hs"><div class="t">Kegiatan ${S.yr}</div><div class="hr"><div><b>${c('done')}</b><small>Done</small></div><div><b>${c('progress')}</b><small>On Progress</small></div><div><b>${c('todo')}</b><small>To do</small></div><div><b>${cst(by)}</b><small>Biaya (Rp)</small></div></div></div></section>`};
function draw(){if(!me()){$('app').innerHTML=hdr()+`<main class="auth in">${vAuth()}</main>`;return}if((S.tab==='usr'||S.tab==='data')&&!isA())S.tab='plan';const V={plan:vPlan,prog:vProg,dok:vDok,det:vDet,sum:vSum,usr:vUsr,data:vData}[S.tab];
 $('app').innerHTML=`${hdr()}<nav>${[...TABS,...(isA()?[['usr','Pengguna','Pengguna','👥'],['data','Data','Data','💾']]:[])].map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[3]}</i><b class="f">${t[1]}</b><b class="s">${t[2]}</b></button>`).join('')}</nav><main class="${S.anim?'in':''}">${S.tab==='plan'||S.tab==='prog'?hero():''}${V()}</main>${S.tab==='plan'?'<button class="fab" onclick="openAct(null)" aria-label="Tambah kegiatan">＋</button>':''}`;S.anim=0}

/* ---------- start ---------- */
(async function boot(){
 if(!sb){$('app').innerHTML=cfgBox();return}
 try{
   ME=(()=>{try{return localStorage.getItem(SK)||null}catch(e){return null}})();
   await loadUsers();
   if(ME&&!U.some(x=>x.u===ME)){ME=null;saveSession()}
   if(ME)await loadData();
   draw();
 }catch(e){$('app').innerHTML=errBox(e.message||String(e))}
})();
</script></body></html>
